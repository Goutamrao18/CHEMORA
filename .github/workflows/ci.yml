name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Project
        run: node scripts/validate-project.mjs
      - name: Smoke API
        run: node scripts/smoke-api.mjs
      - name: Test Experiments
        run: node scripts/test-experiments.mjs
