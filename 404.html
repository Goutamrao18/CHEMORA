<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | CHEMORA</title>
  <meta name="description" content="The requested chemistry laboratory page could not be found on CHEMORA." />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #080d17;
      color: #f1f5f9;
      font-family: Inter, system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 900;
      line-height: 1;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      max-width: 480px;
      line-height: 1.6;
      font-size: 16px;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    a {
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.2s;
    }
    .primary {
      background: #00f0ff;
      color: #040812;
    }
    .primary:hover {
      background: #38bdf8;
      transform: translateY(-2px);
    }
    .secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
    }
</style>
</head>

  <span class="badge">REACTION EQUATION UNBALANCED</span>
  <h1>404</h1>
  <p>The molecular structure or page you are looking for has undergone complete sublimation or does not exist.</p>
  <div class="actions">
    <a href="/" class="primary">Return to Laboratory</a>
