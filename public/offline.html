<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline | CHEMORA</title>
  <meta name="description" content="CHEMORA offline laboratory mode. Cached chemistry study materials remain available." />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #020816;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .flask-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #38bdf8;
      margin-bottom: 24px;
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.3);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      max-width: 440px;
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .btn {
      padding: 12px 28px;
      border-radius: 9999px;
      background: linear-gradient(90deg, #06b6d4, #0284c7);
      color: #030712;
      font-weight: 800;
      font-size: 13px;
      text-decoration: none;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      box-shadow: 0 4px 20px rgba(6, 182, 212, 0.4);
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>
  <div class="flask-icon">⚗</div>
  <span class="badge">OFFLINE LABORATORY MODE</span>
  <h1>Connection Interrupted</h1>
  <p>CHEMORA has temporarily lost connection to the network. Offline knowledge caches and laboratory states remain preserved on this device.</p>
  <button class="btn" id="reconnect-btn">Reconnect Laboratory</button>
  <script>
    document.getElementById('reconnect-btn')?.addEventListener('click', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
